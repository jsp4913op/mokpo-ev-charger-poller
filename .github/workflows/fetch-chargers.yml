name: Fetch Mokpo charger master list

on:
  workflow_dispatch: {}
  schedule:
    # 매주 일요일 UTC 18:00 = 한국시간 월요일 03:00. 마스터 목록(충전소 위치 등)은
    # 거의 안 바뀌는 정적 정보라 주 1회면 충분하고, data.go.kr 트래픽이 적을 새벽 시간대로 잡았다.
    - cron: "0 18 * * 0"

# poll.yml/poll_seoul.yml과 같은 이유로(동시 실행 시 git push 경합) 겹치는 실행은 순서대로 대기시킨다.
concurrency:
  group: fetch-mokpo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python fetch_mokpo_chargers.py

      - name: Sync master list to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python migrate_master_data.py

      - name: Commit and push updated charger list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mokpo_chargers.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: update mokpo charger master list"
          # 겹치는 실행이 있으면 push가 경합할 수 있어 실패 시 재시도(최대 5회).
          # rebase가 실제로 충돌하면 그 상태로 남아 다음 재시도도 연쇄로 실패하므로,
          # 매 시도 전에 이전 시도의 중단된 rebase를 확실히 정리(abort)하고 다시 시도한다.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "push 실패, 재시도 ($i/5)"
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          exit 1
