name: Poll Mokpo EV charger status

on:
  workflow_dispatch: {}

# cron-job.org 자동 호출과 수동 트리거가 겹치면 같은 CSV 파일에 동시에 commit/push하려다
# git 충돌이 날 수 있어(실제로 발생 확인, 2026-09-18), 겹치는 실행은 순서대로 대기시킨다.
concurrency:
  group: poll-mokpo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python poll.py

      - name: Commit and push CSV backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: update charger status log (backup)"
          # poll_seoul.yml과 동시에 push할 때 경합할 수 있어 실패 시 재시도(최대 5회)
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "push 실패, 재시도 ($i/5)"
            sleep 5
          done
          exit 1
